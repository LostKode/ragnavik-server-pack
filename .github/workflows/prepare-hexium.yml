name: Publish to Hexium
run-name: Hexium automatic release ${{ github.run_id }}

on:
  push:
    branches: [main]
    paths: ["manifest.json", ".github/workflows/prepare-hexium.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexium-ragnavik-server
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    environment: hexium-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Resolve release metadata
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version_number"])')
          echo "EXPECTED_VERSION=$version" >> "$GITHUB_ENV"
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate.py
      - run: python3 scripts/build_package.py "dist/LostKode-Ragnavik_Server-$EXPECTED_VERSION.zip"
      - run: dotnet tool restore
      - name: Prepare Hexium release metadata
        run: >-
          python3 scripts/hexium_publish.py prepare
          --manifest manifest.json
          --package "dist/LostKode-Ragnavik_Server-$EXPECTED_VERSION.zip"
          --expected-version "$EXPECTED_VERSION"
          --release-id "${{ github.run_id }}"
          --repository https://hexium.gg
          --category Modpack --category "Client & Server" --category "Valheim 1.0"
          --output .tcli/hexium.toml
      - uses: actions/upload-artifact@v4
        with:
          name: LostKode-Ragnavik_Server-${{ env.EXPECTED_VERSION }}
          path: dist/LostKode-Ragnavik_Server-${{ env.EXPECTED_VERSION }}.zip
          if-no-files-found: error
      - name: Check public release state
        run: |
          public_version=$(python3 scripts/hexium_publish.py current --name Ragnavik_Server)
          if [[ -z "$public_version" ]]; then
            echo "PUBLISH_REQUIRED=true" >> "$GITHUB_ENV"
          elif [[ "$public_version" == "$EXPECTED_VERSION" ]]; then
            echo "PUBLISH_REQUIRED=false" >> "$GITHUB_ENV"
          elif [[ "$(printf '%s\n%s\n' "$public_version" "$EXPECTED_VERSION" | sort -V | tail -n 1)" == "$EXPECTED_VERSION" ]]; then
            echo "PUBLISH_REQUIRED=true" >> "$GITHUB_ENV"
          else
            echo "Expected $EXPECTED_VERSION but Hexium already exposes newer version $public_version" >&2
            exit 1
          fi
      - name: Require Hexium token for publication
        if: env.PUBLISH_REQUIRED == 'true'
        env:
          HEXIUM_AUTH_TOKEN: ${{ secrets.HEXIUM_AUTH_TOKEN }}
        run: test -n "$HEXIUM_AUTH_TOKEN"
      - name: Publish package
        if: env.PUBLISH_REQUIRED == 'true'
        env:
          HEXIUM_AUTH_TOKEN: ${{ secrets.HEXIUM_AUTH_TOKEN }}
        run: >-
          dotnet tool run tcli publish
          --config-path .tcli/hexium.toml
          --file "dist/LostKode-Ragnavik_Server-$EXPECTED_VERSION.zip"
          --token "$HEXIUM_AUTH_TOKEN"
      - name: Build locked deployment tree
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_deployment.py
          --output dist/deployment
          --cache .cache/deployment-packages
          --source-precedence hexium,thunderstore
      - uses: actions/upload-artifact@v4
        with:
          name: Ragnavik-Server-Deployment-${{ env.EXPECTED_VERSION }}
          path: dist/deployment
          if-no-files-found: error
          retention-days: 14
